<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <script>
      // Light is the product default. Dark is applied only after a visitor has
      // deliberately selected and saved it from inside the application.
      try {
        if (localStorage.getItem('mk-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      } catch (_) {}

      // Firebase keeps the technical web.app address permanently. It is not
      // used as a public address: preserve the exact page and query while
      // sending visitors to the branded domain before the application loads.
      if (location.hostname === 'mk-store-app.web.app') {
        location.replace('https://mtjari.shop' + location.pathname + location.search + location.hash)
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="192x192" href="/matjari-favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Matjari" />
    <meta name="apple-mobile-web-app-title" content="Matjari" />
    <meta name="theme-color" content="#4338CA" />
    <meta property="og:site_name" content="Matjari — متجري" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:site" content="@Matjari" />
    <meta name="description" content="أنشئ متجرك، أدر مبيعاتك، ووسّع أعمالك مع Matjari." />
    <title>Matjari | متجري</title>

    <style>
      #root { min-height: 100vh; }
      body { background: #F9F9FF; margin: 0; font-family: 'Cairo', sans-serif; }
      #root .splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #root .splash .splash-logo {
        display: block;
        width: min(300px, 72vw);
        height: auto;
        margin-bottom: 14px;
        filter: drop-shadow(0 8px 18px rgba(99, 102, 241, 0.35));
      }
      #root .splash .splash-logo-image { display: block; width: 100%; height: auto; }
      #root .splash p {
        font-size: 14px;
        color: #565959;
        margin: 0;
      }
      #root .splash .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #DDDDDD;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 16px auto 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <picture class="splash-logo" role="img" aria-label="Matjari — متجري">
          <source media="(prefers-color-scheme: dark)" srcset="/matjari-logo-dark.png" />
          <img class="splash-logo-image" src="/matjari-logo-light.png" alt="Matjari — متجري" />
        </picture>
        <p>جاري التحميل...</p>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
