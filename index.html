<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M&amp;K Store</title>

    <style>
      #root { min-height: 100vh; }
      body { background: #EAEDED; margin: 0; font-family: 'Noto Sans Arabic', sans-serif; }
      #root .splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #root .splash h1 {
        font-size: 20px;
        font-weight: 800;
        margin: 0 0 8px;
        color: #0F1111;
        font-family: 'Plus Jakarta Sans', 'Noto Sans Arabic', sans-serif;
      }
      #root .splash p {
        font-size: 14px;
        color: #565959;
        margin: 0;
      }
      #root .splash .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #DDDDDD;
        border-top-color: #FF9900;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 16px auto 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div style="font-size:40px;margin-bottom:8px">🏪</div>
        <h1>M&amp;K Store</h1>
        <p>جاري التحميل...</p>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
