services:
  - type: web
    name: mk-store-api
    env: node
    buildCommand: cd server && npm install && npx prisma generate && npx tsc
    startCommand: cd server && bash init-db.sh && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: mk-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://mk-store-app.web.app
      - key: PORT
        value: "3001"

databases:
  - name: mk-store-db
    region: frankfurt
    plan: free
