services:
  # Single web service serving both API and frontend
  - type: web
    name: mk-store-api
    env: node
    region: ohio
    plan: free
    buildCommand: npm run build:all
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mk-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://mk-store-api.onrender.com
      - key: PORT
        value: "10000"

databases:
  - name: mk-store-db
    databaseName: mk_store
    region: ohio
    plan: free
    postgresMajorVersion: 16
